# config/app_config/processes.yaml

processes:
  - name: "can_daemon"
    start_order: 0
    stop_order: 100
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars: {}

  - name: "aux_reader"
    start_order: 20
    stop_order: 80
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars: {}

  - name: "task_controller"
    start_order: 30
    stop_order: 70
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars: {}

  - name: "dashboard"
    start_order: 99
    stop_order: 99
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars: {}

subprocesses:
  can_daemon:
    replace_existing_socket: true

  aux_reader:
    joystick_dev: "/dev/input/js0"

  task_controller:
    control_hz: 50.0
    rate_log_interval_s: 1.0
    project_root: "."

  dashboard: {}

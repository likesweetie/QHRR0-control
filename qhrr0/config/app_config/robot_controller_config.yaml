# config/app_config/robot_controller.yaml
process name: "robot_controller"
loop_frequency: 500 #Hz

safety:
  velocity_damping_kd: 0.5
  command_loss_action: "damping"
  feedback_stale_action: "fault"
  damping_timeout_s: 1.0

state_machine:
  enable_duration_s: 0.5

can:
  servers:
    - name: "can_server"
      interface: "vcan0"
      ipc_socket_path: "/tmp/qhrr_can_server.sock"
      connect_timeout_s: 5.0

  bitrates:
    - 1000000

  command_timeout_s: 0.05
  bringup_delay_s: 0.1

  actuator:
    decimation: 1
    shutdown_timeout_s: 2.0

  imu:
    decimation: 1
    enabled: true
    request_all_on_start: true
    startup_request_count: 3
    startup_request_delay_s: 0.01

shm:
  aux_command:
    name: "qhrr_aux_command"
    size_bytes: 4096
    publish_hz: 100.0

  operator_command:
    name: "qhrr_operator_command"
    size_bytes: 4096

  control_state:
    name: "qhrr_control_state"
    size_bytes: 16384
    publish_hz: 500.0

  dashboard_state:
    name: "qhrr_dashboard_state"
    size_bytes: 65536
    publish_hz: 10.0

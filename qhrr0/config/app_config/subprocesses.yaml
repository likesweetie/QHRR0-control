# config/app_config/processes.yaml

processes:
  - name: "can_daemon"
    command:
      - "python3"
      - "-m"
      - "robot_controller.subprocesses.can_daemon.main"
    start_order: 0
    stop_order: 100
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars: {}

  - name: "aux_reader"
    command:
      - "python3"
      - "-m"
      - "robot_controller.subprocesses.aux_reader.main"
      - "--controller-config-key"
      - "robot_controller"
      - "--joystick-dev"
      - "/dev/input/js0"
    start_order: 20
    stop_order: 80
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars: {}

  - name: "task_controller"
    command:
      - "python3"
      - "-m"
      - "robot_controller.subprocesses.task_controller.main"
      - "--config-key"
      - "policy_runner"
    start_order: 30
    stop_order: 70
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars:
      QHRR_PROJECT_ROOT: "."
      TASK_CONTROL_HZ: "50.0"
      TASK_RATE_LOG_INTERVAL_S: "1.0"

  - name: "dashboard"
    command:
      - "python3"
      - "-m"
      - "robot_controller.subprocesses.dashboard.main"
      - "--config-key"
      - "dashboard"
    start_order: 99
    stop_order: 99
    new_terminal: true
    terminal_command:
      - "gnome-terminal"
      - "--wait"
      - "--"
    working_dir: "."
    env_vars: {}
